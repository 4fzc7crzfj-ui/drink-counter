<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tap Drink 2">
<meta name="theme-color" content="#1A0F24">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Tap a schooner. Pour a cellar. Tap Drink 2 is an idle game that stays on your phone.">
<title>Tap Drink 2</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #1A0F24;
  --card: #261433;
  --beer: #F5A623;
  --beer-deep: #C47E14;
  --foam: #FFF8E7;
  --muted: rgba(255,248,231,.62);
  --faint: rgba(255,248,231,.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--foam);
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body {
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--beer); outline-offset: 2px; }
[hidden] { display: none !important; }
.app {
  width: 100%;
  max-width: 480px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  position: relative;
  z-index: 0;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at 50% 18%, rgba(245,166,35,.16), transparent 52%),
    var(--bg);
  overflow: hidden;
}
.wallpaper {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.wallpaper-word {
  position: absolute;
  left: var(--x);
  top: 100%;
  margin: 0;
  font-size: var(--size);
  font-weight: 800;
  letter-spacing: .04em;
  line-height: 1;
  color: var(--foam);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  animation: wallpaper-rise var(--dur, 36s) linear var(--delay, 0s) infinite;
}
@keyframes wallpaper-rise {
  0% { transform: translate3d(0, 12px, 0); opacity: 0; }
  9% { opacity: var(--fade); }
  88% { opacity: var(--fade); }
  100% { transform: translate3d(0, calc(-1 * var(--travel, 120vh)), 0); opacity: 0; }
}
header, footer { position: relative; z-index: 1; }
header { padding: calc(env(safe-area-inset-top) + 8px) 16px 0; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
h1 span { color: var(--beer); }
#sound {
  width: 44px; height: 44px; border: 0; border-radius: 14px;
  background: var(--card); font-size: 18px; cursor: pointer; flex: none;
}
.count {
  margin-top: 2px;
  font-size: clamp(40px, 12vw, 58px);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: .95;
  font-variant-numeric: tabular-nums;
}
.unit {
  margin-top: 2px;
  color: var(--beer);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.rates {
  margin-top: 2px;
  color: var(--muted);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.rates b { color: var(--foam); font-weight: 750; }
.dot { margin: 0 6px; opacity: .5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  font-size: 11px; font-weight: 800; letter-spacing: .01em;
  padding: 3px 8px; border-radius: 999px; background: #261433; color: var(--beer);
}
.chip.hot { background: var(--beer); color: #1A0F24; }
.golden {
  position: absolute; z-index: 3; width: 62px; height: 62px; border: 0; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff6c8, #f5a623 58%, #a86b10);
  box-shadow: 0 0 16px rgba(245,166,35,.85); font-size: 28px; cursor: pointer;
  animation: floaty 1.3s ease-in-out infinite;
}
@keyframes floaty { 50% { transform: translateY(-6px); } }
.toast {
  position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px);
  z-index: 8; background: #261433; color: var(--foam); border-radius: 14px;
  padding: 10px 12px; text-align: center; font-weight: 800; pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(245,166,35,.45), 0 10px 24px rgba(0,0,0,.4);
}
.tabs { display: flex; gap: 4px; padding: 0 10px 6px; overflow-x: auto; }
.tabs button {
  flex: 1 1 auto; min-height: 34px; padding: 0 6px; border: 0; border-radius: 999px;
  background: #261433; color: var(--foam); font-size: 12px; font-weight: 800; cursor: pointer;
}
.tabs button.on { background: var(--beer); color: #1A0F24; }
#pour .skin { display: none; }
#pour:not([data-skin]) .skin-schooner,
#pour[data-skin="schooner"] .skin-schooner,
#pour[data-skin="pint"] .skin-pint,
#pour[data-skin="jug"] .skin-jug,
#pour[data-skin="goon"] .skin-goon,
#pour[data-skin="keg"] .skin-keg { display: inline; }
.skin-pint .stream { transform-origin: 100px 18px; }
.skin-jug .stream { transform-origin: 96px 78px; }
.skin-goon .stream { transform-origin: 173px 202px; }
.skin-keg .stream { transform-origin: 100px 188px; }
.app[data-venue="rsl"] { --bg: #102218; --beer: #e4c15a; background: radial-gradient(ellipse at 50% 18%, rgba(80,160,90,.28), transparent 55%), var(--bg); }
.app[data-venue="garden"] { --bg: #17240f; --beer: #d6e36a; background: radial-gradient(ellipse at 50% 18%, rgba(170,190,60,.25), transparent 55%), var(--bg); }
.app[data-venue="oktober"] { --bg: #2a140c; --beer: #ff8a1a; background: radial-gradient(ellipse at 50% 18%, rgba(255,120,20,.28), transparent 55%), var(--bg); }
.app[data-venue="moon"] { --bg: #0c1224; --beer: #d5e4ff; background: radial-gradient(ellipse at 50% 18%, rgba(150,180,255,.22), transparent 55%), var(--bg); }
.stage {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
  padding: 4px 12px 0;
}
.hint {
  margin: 0 0 2px;
  color: var(--muted);
  font-size: 14px;
  letter-spacing: .01em;
}
#pour {
  border: 0;
  background: transparent;
  padding: 0;
  height: 54vh;
  height: min(54dvh, 460px);
  cursor: pointer;
  -webkit-touch-callout: none;
}
#pour:active { transform: scale(.97); }
#pour svg { height: 100%; width: auto; display: block; overflow: visible; }
.stream { opacity: 1; transform-origin: 100px 74px; }
.foam { transform-origin: 100px 136px; }
.glass-wrap { transform-origin: 100px 230px; }
.glow { opacity: .2; }
.is-pouring .stream { animation: stream .48s ease-out; }
.is-pouring .foam { animation: head .48s ease-out; }
.is-pouring .glass-wrap { animation: wob .42s ease-out; }
.is-pouring .glow { animation: glow .48s ease-out; }
@keyframes stream {
  0% { transform: scaleY(.35); }
  35% { transform: scaleY(1.08); }
  100% { transform: scaleY(1); }
}
@keyframes head {
  0% { transform: translateY(6px) scaleX(.94); }
  38% { transform: translateY(-9px) scale(1.07, 1.12); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes wob {
  0% { transform: rotate(0); }
  30% { transform: rotate(-1.8deg) scale(.985); }
  62% { transform: rotate(1.2deg); }
  100% { transform: rotate(0) scale(1); }
}
@keyframes glow {
  35% { opacity: .5; }
}
#floats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater {
  position: absolute;
  top: 38%;
  font-weight: 800;
  font-size: 34px;
  color: var(--beer);
  text-shadow: 0 2px 0 #1A0F24, 0 0 16px rgba(255,248,231,.45);
  animation: up .9s ease-out forwards;
  white-space: nowrap;
}
@keyframes up {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); }
  16% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
  100% { opacity: 0; transform: translate(-50%, -96px) scale(1); }
}
.pop { animation: pop .18s ease-out; }
@keyframes pop {
  40% { transform: scale(1.06); }
}
footer { padding: 6px 16px calc(env(safe-area-inset-bottom) + 12px); }
#shopBtn {
  width: 100%;
  min-height: 56px;
  border: 0;
  border-radius: 18px;
  background: var(--beer);
  color: #1A0F24;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 10px 28px rgba(245,166,35,.22);
}
#shopBtn:active { transform: scale(.985); }
.badge {
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 99px;
  background: #1A0F24;
  color: var(--beer);
  font-size: 13px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: rgba(8, 3, 14, .62);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-layer { z-index: 6; align-items: center; padding: 22px; }
.sheet {
  width: 100%;
  max-height: min(88%, 760px);
  background: #160c1e;
  border-radius: 22px 22px 0 0;
  border-top: 2px solid rgba(245,166,35,.5);
  box-shadow: 0 -18px 50px rgba(0,0,0,.45);
  display: flex;
  flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
  animation: slide .26s ease-out;
}
@keyframes slide {
  from { transform: translateY(18px); }
  to { transform: none; }
}
.handle { width: 42px; height: 4px; border-radius: 99px; background: rgba(255,248,231,.28); margin: 8px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 0 16px; }
.sheet-head h2 { margin: 0; font-size: 20px; }
#closeShop, .icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 14px;
  background: var(--card); color: var(--foam); font-size: 18px; cursor: pointer;
}
.blurb { margin: 0 16px 8px; color: var(--faint); font-size: 12px; }
.qty { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 8px; }
.qty button {
  min-height: 40px; border: 0; border-radius: 12px; background: var(--card);
  color: var(--foam); font-weight: 800; cursor: pointer;
}
.qty button.on { background: var(--beer); color: #1A0F24; }
.sheet-body {
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 0 14px;
  min-height: 0;
  flex: 1;
}
.sec {
  margin: 10px 2px 8px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--beer);
}
.item {
  width: 100%;
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  text-align: left;
  background: var(--card);
  border: 0;
  border-radius: 16px;
  padding: 10px 10px 10px 10px;
  margin: 0 0 8px;
  color: var(--foam);
  cursor: pointer;
}
.item:active { transform: scale(.985); }
.item.can { box-shadow: inset 0 0 0 1.5px rgba(245,166,35,.9); }
.item.owned { cursor: default; opacity: .58; }
.item .ico { font-size: 24px; line-height: 1; text-align: center; }
.item .name { display: block; font-weight: 750; font-size: 15px; }
.item .own { font-weight: 700; font-size: 12px; color: var(--muted); margin-left: 4px; }
.item .desc { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.3; }
.item .rate { display: block; margin-top: 3px; color: var(--beer); font-size: 12px; font-weight: 700; }
.price {
  display: block;
  background: #3a2a48;
  color: rgba(255,248,231,.55);
  border-radius: 12px;
  min-width: 72px;
  padding: 8px 10px;
  text-align: center;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  white-space: nowrap;
}
.item.can .price { background: var(--beer); color: #1A0F24; }
.price small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .04em; opacity: .8; }
.item.owned .price {
  background: transparent;
  color: var(--foam);
  box-shadow: inset 0 0 0 1px rgba(255,248,231,.28);
}
.item.shake { animation: shake .28s linear; }
@keyframes shake {
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
.sheet-foot { padding: 6px 14px 12px; }
.fine { margin: 0 0 6px; font-size: 12px; line-height: 1.35; color: var(--faint); text-align: center; }
.fine a { color: var(--muted); font-weight: 700; text-decoration: none; }
.reset {
  display: block;
  margin: 8px auto 0;
  padding: 0;
  border: 0;
  background: none;
  color: rgba(255,248,231,.38);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.2;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.dialog {
  width: min(100%, 360px);
  background: #261433;
  border-radius: 22px;
  padding: 20px 18px 16px;
  box-shadow: 0 18px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(245,166,35,.35);
}
.dialog h3 { margin: 0 0 8px; font-size: 22px; }
.dialog p { margin: 0; color: rgba(255,248,231,.84); line-height: 1.4; }
.dialog-actions { display: flex; gap: 10px; margin-top: 16px; }
.dialog-actions button {
  flex: 1;
  min-height: 48px;
  border: 0;
  border-radius: 14px;
  font-weight: 800;
  cursor: pointer;
}
#modalCancel, #modalOk.primary { background: var(--beer); color: #1A0F24; }
#modalOk.danger {
  background: transparent;
  color: #ffb4bc;
  box-shadow: inset 0 0 0 1.5px rgba(255,93,108,.7);
}
.sr {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .stream, .foam, .glass-wrap, .glow, .floater, .pop, .sheet, .item.shake, .wallpaper-word {
    animation: none !important;
  }
  .floater { opacity: 1; }
  .wallpaper-word {
    top: var(--rest);
    opacity: var(--fade);
    transform: none;
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>
  <header>
    <div class="title-row">
      <h1>Tap Drink <span>2</span></h1>
      <button type="button" id="sound" aria-pressed="false" aria-label="Sound off">🔇</button>
    </div>
    <div id="count" class="count">0</div>
    <div class="unit">schooners</div>
    <div class="rates"><b id="sps">0.0</b> / sec<span class="dot">·</span><b id="tpc">1</b> / tap</div>
    <div class="chips">
      <span class="chip" id="hhChip">Happy Hour</span>
      <span class="chip hot" id="comboChip" hidden>Combo</span>
      <span class="chip hot" id="frenzyChip" hidden>Frenzy</span>
      <span class="chip" id="tokenChip" hidden></span>
    </div>
  </header>
  <div class="stage" id="stage">
    <p class="hint" id="hint">Tap the schooner</p>
    <button type="button" id="pour" aria-label="Pour a schooner">
      <svg class="schooner" viewBox="0 0 200 280" aria-hidden="true">
        <defs>
          <linearGradient id="tdBeer" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFC14D"/>
            <stop offset=".55" stop-color="#F5A623"/>
            <stop offset="1" stop-color="#C47E14"/>
          </linearGradient>
          <linearGradient id="tdWood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F0B15A"/>
            <stop offset="1" stop-color="#C47E14"/>
          </linearGradient>
          <linearGradient id="pintBeer" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E39A2E"/>
            <stop offset="1" stop-color="#8C4E0C"/>
          </linearGradient>
          <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F7F9FC"/>
            <stop offset=".22" stop-color="#C5CED8"/>
            <stop offset=".48" stop-color="#F4F7FA"/>
            <stop offset=".72" stop-color="#8E98A6"/>
            <stop offset="1" stop-color="#DEE5ED"/>
          </linearGradient>
          <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#A32038"/>
            <stop offset="1" stop-color="#4A0614"/>
          </linearGradient>
          <linearGradient id="kegGold" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#A87420"/>
            <stop offset=".35" stop-color="#F6E2A0"/>
            <stop offset=".7" stop-color="#C9962E"/>
            <stop offset="1" stop-color="#8A5E14"/>
          </linearGradient>
          <clipPath id="tdGlass">
            <path d="M42 120 H158 L146 244 Q142 256 128 256 H72 Q58 256 54 244 Z"/>
          </clipPath>
          <clipPath id="pintClip">
            <path d="M62 40 H138 L132 248 Q100 260 68 248 Z"/>
          </clipPath>
          <clipPath id="jugClip">
            <path d="M34 108 H150 Q162 108 162 124 V214 Q162 236 140 236 H48 Q28 236 28 214 V124 Q28 108 34 108 Z"/>
          </clipPath>
          <clipPath id="goonBag">
            <path d="M46 74 Q34 74 30 92 L26 156 Q24 206 46 222 Q78 240 108 240 Q150 240 176 220 Q190 204 186 156 L182 92 Q178 74 160 74 Q108 64 46 74 Z"/>
          </clipPath>
        </defs>
        <g class="skin skin-schooner">
          <g transform="translate(0,-16)">
            <ellipse class="glow" cx="100" cy="258" rx="74" ry="14" fill="#F5A623"/>
            <rect x="76" y="2" width="48" height="36" rx="12" fill="url(#tdWood)"/>
            <rect x="76" y="16" width="48" height="8" fill="#F5A623"/>
            <rect x="26" y="34" width="148" height="30" rx="12" fill="#FFF8E7"/>
            <path d="M88 64 h24 v14 h-24 z" fill="#FFF8E7"/>
            <path d="M94 76 h12 l6 8 h-24 z" fill="#FFF8E7"/>
            <g class="stream">
              <rect x="92" y="74" width="16" height="70" rx="8" fill="#F5A623"/>
              <ellipse cx="100" cy="142" rx="11" ry="6" fill="#F5A623"/>
            </g>
            <g class="glass-wrap">
              <path d="M36 114 H164 L150 246 Q146 264 128 264 H72 Q54 264 50 246 Z" fill="#2A1838" stroke="#FFF8E7" stroke-opacity=".4" stroke-width="3"/>
              <g clip-path="url(#tdGlass)">
                <rect x="36" y="138" width="128" height="130" fill="url(#tdBeer)"/>
                <ellipse cx="70" cy="200" rx="14" ry="36" fill="#FFF8E7" opacity=".14"/>
                <g class="foam">
                  <ellipse cx="100" cy="146" rx="56" ry="16" fill="#FFF8E7"/>
                  <circle cx="62" cy="140" r="11" fill="#FFF8E7"/>
                  <circle cx="96" cy="132" r="13" fill="#FFF8E7"/>
                  <circle cx="128" cy="138" r="12" fill="#FFF8E7"/>
                  <circle cx="150" cy="146" r="8" fill="#FFF8E7"/>
                  <circle cx="78" cy="136" r="4" fill="#F5A623" opacity=".35"/>
                  <circle cx="116" cy="134" r="3" fill="#F5A623" opacity=".28"/>
                </g>
                <circle cx="76" cy="230" r="3" fill="#FFF8E7" opacity=".75">
                  <animate attributeName="cy" values="232;156" dur="2.7s" repeatCount="indefinite"/>
                  <animate attributeName="opacity" values=".75;0" dur="2.7s" repeatCount="indefinite"/>
                </circle>
                <circle cx="118" cy="240" r="2.3" fill="#FFF8E7" opacity=".6">
                  <animate attributeName="cy" values="246;160" dur="3.2s" begin=".7s" repeatCount="indefinite"/>
                  <animate attributeName="opacity" values=".65;0" dur="3.2s" begin=".7s" repeatCount="indefinite"/>
                </circle>
                <circle cx="138" cy="210" r="2" fill="#FFF8E7" opacity=".55">
                  <animate attributeName="cy" values="220;158" dur="2.3s" begin=".3s" repeatCount="indefinite"/>
                  <animate attributeName="opacity" values=".6;0" dur="2.3s" begin=".3s" repeatCount="indefinite"/>
                </circle>
                <circle cx="94" cy="250" r="1.6" fill="#FFF8E7">
                  <animate attributeName="cy" values="252;164" dur="3s" begin="1.3s" repeatCount="indefinite"/>
                  <animate attributeName="opacity" values=".5;0" dur="3s" begin="1.3s" repeatCount="indefinite"/>
                </circle>
              </g>
              <path d="M58 132 v92" stroke="#FFF8E7" stroke-opacity=".28" stroke-width="6" stroke-linecap="round"/>
              <ellipse cx="100" cy="116" rx="64" ry="9" fill="none" stroke="#FFF8E7" stroke-opacity=".5" stroke-width="3"/>

<script src="economy.js"></script>
<script>
(function () {
  'use strict';
  var E = window.TapDrinkEconomy;
  var KEY = 'tapdrink2';
  var $ = function (id) { return document.getElementById(id); };
  var countEl = $('count');
  var spsEl = $('sps');
  var tpcEl = $('tpc');
  var badge = $('badge');
  var shopBtn = $('shopBtn');
  var hint = $('hint');
  var pourBtn = $('pour');
  var svg = pourBtn.querySelector('svg');
  var floats = $('floats');
  var sheet = $('sheet');
  var shopList = $('shopList');
  var modal = $('modal');
  var modalTitle = $('modalTitle');
  var modalBody = $('modalBody');
  var modalOk = $('modalOk');
  var modalCancel = $('modalCancel');
  var soundBtn = $('sound');
  var lifetimeEl = $('lifetime');
  var multNote = $('multNote');
  var live = $('live');

  var state = E.freshState(Date.now());
  var buyMode = 1;
  var lastSig = '';
  var holding = false;
  var dirty = false;
  var pendingAway = null;
  var modalMode = null;
  var audio = null;
  var lastSave = 0;
  var saveTimer = 0;
  var lastLive = 0;
  var floaterCount = 0;
  var shopTab = 'cellar';
  var combo = 0;
  var lastTapAt = 0;
  var comboDecayAt = 0;
  var nextGolden = Date.now() + 20000 + Math.random() * 40000;
  var goldenHideAt = 0;
  var toastQueue = [];
  var toastOn = false;

  (function buildWallpaper() {
    var host = $('wallpaper');
    if (!host) return;
    var phrases = [
      'THE DRINK STAYS TAPPED',
      '🫵🍺',
      'THE FINGER STAYS TAPPING',
      'DRINK STAYS TAPPED',
      'THOUGHTS ON TAP DRINK 2?',
      'SIDELINED?',
      'DRINKTAPPEDLINED?',
      'TAP DRINK AND CHILL?',
      'ONE MORE TAP?',
      'POUR DECISIONS',
      'TAPS ARE OPEN 🍺',
      'TAP DRINK AND FUCK?',
      'JUST ONE MORE TAP'
    ];
    var order = phrases.slice();
    var n;
    for (n = order.length - 1; n > 0; n--) {
      var swap = Math.floor(Math.random() * (n + 1));
      var tmp = order[n];
      order[n] = order[swap];
      order[swap] = tmp;
    }
    var dur = 36;
    var els = order.map(function (text) {
      var el = document.createElement('span');
      el.className = 'wallpaper-word';
      el.textContent = text;
      el.dataset.rand = String(Math.random());
      el.dataset.scale = String(text.length < 6 ? 1 : 0.88 + Math.random() * 0.12);
      el.dataset.fade = (0.1 + Math.random() * 0.05).toFixed(3);
      if (text.length < 6) el.style.letterSpacing = '0';
      host.appendChild(el);
      return el;
    });

    function layout() {
      var width = host.clientWidth || window.innerWidth || 320;
      var height = host.clientHeight || window.innerHeight || 640;
      var count = els.length;
      var pad = 8;
      var travel = height + 64;
      var slot = Math.min(travel / count, Math.max(1, (height - pad * 2) / count));
      var maxFont = Math.max(11, Math.min(18, slot * 0.52));
      host.style.setProperty('--travel', travel.toFixed(1) + 'px');
      els.forEach(function (el, i) {
        var font = maxFont * (+el.dataset.scale || 1);
        if (el.textContent.length < 6) font = Math.min(slot * 0.62, maxFont * 1.45);
        el.style.fontSize = font.toFixed(1) + 'px';
        var guard = 0;
        while (el.scrollWidth > width - pad * 2 && font > 10 && guard < 24) {
          font -= 0.5;
          el.style.fontSize = font.toFixed(1) + 'px';
          guard++;
        }
        var room = Math.max(0, width - el.scrollWidth - pad * 2);
        var left = pad + (+el.dataset.rand || 0) * room;
        el.style.setProperty('--x', left.toFixed(1) + 'px');
        el.style.setProperty('--size', font.toFixed(1) + 'px');
        el.style.setProperty('--fade', el.dataset.fade);
        el.style.setProperty('--dur', dur + 's');
        el.style.setProperty('--delay', (-(i / count) * dur).toFixed(3) + 's');
        el.style.setProperty('--rest', (pad + i * slot).toFixed(1) + 'px');
      });
    }

    layout();
    var resizeTimer = 0;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(layout, 150);
    });
  })();

  function readRaw() {
    try { return JSON.parse(localStorage.getItem(KEY) || 'null'); }
    catch (err) { return null; }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (err) {}
    lastSave = Date.now();
  }

  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 350);
  }

  function group(n) {
    return String(Math.floor(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function fmt(n) {
    if (!isFinite(n) || n < 0) n = 0;
    if (n < 1e6) return group(n);
    var units = [[1e15, 'Qa'], [1e12, 'T'], [1e9, 'B'], [1e6, 'M']];
    for (var i = 0; i < units.length; i++) {
      if (n >= units[i][0]) {
        var x = n / units[i][0];
        var digits = x >= 100 ? 0 : x >= 10 ? 1 : 2;
        return x.toFixed(digits) + units[i][1];
      }
    }
    return group(n);
  }

  function fmtExact(n) {
    if (!isFinite(n) || n <= 0) return '0';
    if (n < 1000) {
      if (Math.abs(n - Math.round(n)) < 0.001) return group(Math.round(n));
      return (Math.round(n * 10) / 10).toFixed(1);
    }
    return fmt(n);
  }

  function fmtSps(n) {
    if (!isFinite(n) || n < 0) n = 0;
    if (n < 100) return (Math.round(n * 10) / 10).toFixed(1);
    return fmt(n);
  }

  function fmtRate(n) {
    if (!isFinite(n) || n <= 0) return '0';
    if (n < 10) {
      var r = Math.round(n * 10) / 10;
      return Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : r.toFixed(1);
    }
    if (n < 100) return String(Math.round(n));
    return fmt(n);
  }

  function setText(el, text) {
    if (el.textContent !== text) el.textContent = text;
  }

  function fmtMult(m) {
    if (!isFinite(m) || m <= 0) return '1';
    var r = Math.round(m * 100) / 100;
    if (Math.abs(r - Math.round(r)) < 0.001) return String(Math.round(r));
    return String(r);
  }

  function account() {
    var now = Date.now();
    var elapsed = (now - state.t) / 1000;
    var away = E.applyElapsed(state, elapsed);
    state.t = now;
    if (elapsed >= 45 && away.gain >= 1) {
      pendingAway = { gain: away.gain, capped: elapsed > E.OFFLINE_CAP_SECONDS };
    }
    return away;
  }

  function signature() {
    var daily = state.daily || {};
    var parts = [shopTab, String(buyMode), String(state.tokens), state.venue, state.skin, String(state.levels.gold), String(state.levels.diamond), String(state.prestiges), daily.day || '', String(daily.progress || 0), daily.done ? '1' : '0', daily.claimed ? '1' : '0', String(Object.keys(state.achievements).length)];
    var i;
    for (i = 0; i < E.UPGRADES.length; i++) {
      var u = E.UPGRADES[i];
      parts.push(u.id + (state.upgrades[u.id] ? 'o' : (state.schooners + 1e-4 >= u.cost ? 'y' : 'n')));
    }
    for (i = 0; i < E.PRODUCERS.length; i++) {
      var p = E.PRODUCERS[i];
      var q = E.quoteProducer(state, p.id, buyMode);
      parts.push(p.id + ':' + q.owned + ':' + (q.afford ? 'y' : 'n') + ':' + q.cost);
    }
    return parts.join('|');
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function itemHtml(opts) {
    return '<button type="button" class="item' + (opts.cls || '') + '" data-kind="' + opts.kind + '" data-buy="' + opts.id + '"' + (opts.disabled ? ' disabled' : '') + '>' +
      '<span class="ico" aria-hidden="true">' + opts.icon + '</span>' +
      '<span class="meta"><span class="name">' + esc(opts.name) + (opts.own ? '<span class="own">' + esc(opts.own) + '</span>' : '') + '</span>' +
      '<span class="desc">' + esc(opts.desc) + '</span>' +
      (opts.rate ? '<span class="rate">' + opts.rate + '</span>' : '') + '</span>' +
      '<span class="price">' + opts.price + '</span></button>';
  }

  function renderShop(force) {
    var sig = signature();
    if (!force && sig === lastSig) return;
    lastSig = sig;
    var top = shopList.scrollTop;
    var html = '';
    var blurbs = {
      cellar: 'Another of the same cellar item costs about 15% more.',
      upgrades: 'One-time pours, then Gold Tap and Diamond Schooner with no level cap.',
      venues: 'Unlock a room. The one you pick changes the bar and pays a bonus.',
      skins: 'Cosmetic glasses. Your pour stays the same.',
      more: 'Last Call, the daily, badges, and a card to share.'
    };
    setText($('tabBlurb'), blurbs[shopTab] || '');
    $('qtyRow').hidden = shopTab !== 'cellar';
    if (shopTab === 'cellar') {
      E.PRODUCERS.forEach(function (p) {
        var q = E.quoteProducer(state, p.id, buyMode);
        var rate = esc(fmtRate(q.each)) + '/s each';
        if (q.owned) rate += ' · ' + esc(fmtRate(q.total)) + '/s';
        var qtyLabel = buyMode === 10 ? '<small>×10</small>' : '';
        html += itemHtml({ kind: 'prod', id: p.id, icon: p.icon, name: p.name, own: q.owned ? '×' + q.owned : '', desc: p.desc, rate: rate, price: esc(fmt(q.cost)) + qtyLabel, cls: q.afford ? ' can' : '' });
      });
    } else if (shopTab === 'upgrades') {
      var pending = [];
      var ownedUps = [];
      E.UPGRADES.forEach(function (u) { (state.upgrades[u.id] ? ownedUps : pending).push(u); });
      pending.concat(ownedUps).forEach(function (u) {
        var have = !!state.upgrades[u.id];
        var can = !have && state.schooners + 1e-4 >= u.cost;
        html += itemHtml({ kind: 'up', id: u.id, icon: u.icon, name: u.name, desc: u.desc, price: have ? 'Owned' : esc(fmt(u.cost)), cls: have ? ' owned' : can ? ' can' : '', disabled: have });
      });
      html += '<div class="sec">Beyond max</div>';
      E.LEVELS.forEach(function (lv) {
        var owned = state.levels[lv.id] || 0;
        var cost = E.levelCost(lv.id, owned);
        var can = state.schooners + 1e-4 >= cost;
        html += itemHtml({ kind: 'level', id: lv.id, icon: lv.icon, name: lv.name, own: 'Lv ' + owned, desc: lv.desc, price: esc(fmt(cost)), cls: can ? ' can' : '' });
      });
    } else if (shopTab === 'venues') {
      E.VENUES.forEach(function (v) {
        var owned = !!state.venues[v.id];
        var on = state.venue === v.id;
        var can = !owned && state.schooners + 1e-4 >= v.cost;
        html += itemHtml({ kind: 'venue', id: v.id, icon: v.icon, name: v.name, own: on ? 'Here' : '', desc: v.desc, price: owned ? (on ? 'On' : 'Use') : (v.cost ? esc(fmt(v.cost)) : 'Free'), cls: on ? ' owned' : can ? ' can' : '' });
      });
    } else if (shopTab === 'skins') {
      E.SKINS.forEach(function (skin) {
        var owned = !!state.skins[skin.id];
        var on = state.skin === skin.id;
        var can = !owned && state.schooners + 1e-4 >= skin.cost;
        html += itemHtml({ kind: 'skin', id: skin.id, icon: skin.icon, name: skin.name, own: on ? 'On' : '', desc: skin.desc, price: owned ? (on ? 'On' : 'Wear') : esc(fmt(skin.cost)), cls: on ? ' owned' : can ? ' can' : '' });
      });
    } else {
      var gain = E.tokensFromRun(state.run);
      var nextMult = (1 + (state.tokens + gain) * 0.05);
      html += itemHtml({ kind: 'prestige', id: 'last', icon: '🎟️', name: 'Last Call', desc: gain ? ('Reset this run for ' + gain + ' Hangover Tokens. Permanent income becomes ×' + fmtMult(nextMult) + '.') : 'Pour 1,000,000 schooners this run to earn Hangover Tokens.', price: gain ? '+' + gain : '—', cls: gain ? ' can' : '' });
      var ch = E.ensureDaily(state);
      var daily = state.daily;
      var left = '';
      if (ch.limit && daily.started && !daily.done) {
        var remain = Math.max(0, Math.ceil((daily.started + ch.limit * 1000 - Date.now()) / 1000));
        left = ' · ' + remain + 's left';
      }
      var price = daily.claimed ? 'Done' : daily.done ? 'Claim' : (ch.limit && !daily.started ? 'Start' : esc(fmt(daily.progress)) + '/' + esc(fmt(ch.goal)));
      html += itemHtml({ kind: 'daily', id: ch.id, icon: '📅', name: ch.name, desc: ch.desc + left + ' Reward ' + fmt(ch.reward) + '.', price: price, cls: daily.done && !daily.claimed ? ' can' : '' });
      html += itemHtml({ kind: 'share', id: 'card', icon: '📤', name: 'Share my score', desc: 'A card with your pours, tokens, and venue.', price: 'Share', cls: ' can' });
      html += '<div class="sec">Badges</div>';
      E.ACHIEVEMENTS.forEach(function (a) {
        var have = !!state.achievements[a.id];
        html += itemHtml({ kind: 'badge', id: a.id, icon: a.icon, name: a.name, desc: a.desc, price: have ? 'Got' : '—', cls: have ? ' owned' : '', disabled: true });
      });
    }
    shopList.innerHTML = html;
    shopList.scrollTop = top;
  }

  function renderHud() {
    var now = Date.now();
    setText(countEl, fmt(state.schooners));
    setText(spsEl, fmtSps(E.passivePerSecond(state)));
    setText(tpcEl, fmtExact(E.tapValue(state, combo)));
    var n = E.affordableCount(state);
    badge.hidden = n < 1;
    if (n > 0) setText(badge, String(n));
    shopBtn.setAttribute('aria-label', n > 0 ? ('Shop, ' + n + ' ready') : 'Shop');
    hint.hidden = state.taps > 0;
    var mult = E.globalMult(state);
    multNote.hidden = mult <= 1;
    setText(multNote, mult > 1 ? ('All income ×' + fmtMult(mult)) : '');
    setText(lifetimeEl, fmt(state.total) + ' poured · ' + fmt(state.taps) + ' taps');
    var hour = E.happyHourHour(new Date(now));
    var hh = $('hhChip');
    if (E.inHappyHour(new Date(now))) {
      setText(hh, 'Happy Hour 2×');
      hh.className = 'chip hot';
    } else {
      var label = hour % 12 || 12;
      setText(hh, 'Happy Hour ' + label + (hour < 12 ? 'am' : 'pm'));
      hh.className = 'chip';
    }
    var comboChip = $('comboChip');
    var cMult = E.comboMultiplier(combo);
    comboChip.hidden = combo < 2;
    if (combo >= 2) setText(comboChip, 'Combo ×' + fmtMult(cMult));
    var frenzy = $('frenzyChip');
    var left = Math.ceil(((state.frenzyUntil || 0) - now) / 1000);
    frenzy.hidden = left <= 0;
    if (left > 0) setText(frenzy, 'Frenzy 7× · ' + left + 's');
    var tokenChip = $('tokenChip');
    tokenChip.hidden = !(state.tokens > 0);
    if (state.tokens > 0) setText(tokenChip, '🎟 ' + fmt(state.tokens));
    if (now - lastLive > 5000) {
      lastLive = now;
      setText(live, fmt(state.schooners) + ' schooners, ' + fmtSps(E.passivePerSecond(state)) + ' per second');
    }
  }

  function maybeRenderShop() {
    if (sheet.hidden) return;
    var sig = signature();
    if (sig === lastSig) return;
    if (holding) { dirty = true; return; }
    dirty = false;
    renderShop(false);
  }

  function updateSound() {
    soundBtn.textContent = state.sound ? '🔊' : '🔇';
    soundBtn.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
    soundBtn.setAttribute('aria-label', state.sound ? 'Sound on' : 'Sound off');
  }

  function blip() {
    if (!state.sound) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audio) audio = new Ctx();
      if (audio.state === 'suspended') audio.resume();
      var t = audio.currentTime;
      var o = audio.createOscillator();
      var g = audio.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(290, t);
      o.frequency.exponentialRampToValueAtTime(130, t + 0.1);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.045, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      o.connect(g);
      g.connect(audio.destination);
      o.start(t);
      o.stop(t + 0.14);
    } catch (err) {}
  }

  function popCount() {
    countEl.classList.remove('pop');
    void countEl.offsetWidth;
    countEl.classList.add('pop');
  }

  function spawnFloater(gain) {
    var el = document.createElement('span');
    el.className = 'floater';
    el.textContent = '+' + fmtExact(gain);
    el.style.left = (52 + Math.random() * 30) + '%';
    el.style.top = (26 + Math.random() * 24) + '%';
    floats.appendChild(el);
    floaterCount++;
    var remove = function () { if (el.parentNode) { el.remove(); floaterCount--; } };
    el.addEventListener('animationend', remove);
    setTimeout(remove, 1000);
    if (floaterCount > 14) {
      var first = floats.firstChild;
      if (first) { first.remove(); floaterCount--; }
    }
  }

  function toast(text) {
    toastQueue.push(text);
    pumpToast();
  }

  function pumpToast() {
    var box = $('toast');
    if (toastOn || !toastQueue.length) return;
    toastOn = true;
    box.hidden = false;
    box.textContent = toastQueue.shift();
    setTimeout(function () {
      box.hidden = true;
      toastOn = false;
      pumpToast();
    }, 2200);
  }

  function noteUnlocks(list) {
    for (var i = 0; i < list.length; i++) {
      var a = E.achievementById(list[i]);
      if (a) toast(a.icon + ' ' + a.name);
    }
  }

  function applyLook() {
    var venue = state.venue && state.venue !== 'pub' ? state.venue : '';
    if (venue) document.querySelector('.app').setAttribute('data-venue', venue);
    else document.querySelector('.app').removeAttribute('data-venue');
    pourBtn.setAttribute('data-skin', state.skin || 'schooner');
    var themes = { rsl: '#102218', garden: '#17240f', oktober: '#2a140c', moon: '#0c1224' };
    var bg = themes[state.venue] || '#1A0F24';
    document.body.style.background = bg;
    document.documentElement.style.background = bg;
  }

  function showGolden() {
    var btn = $('golden');
    btn.hidden = false;
    btn.style.left = (6 + Math.random() * 28) + '%';
    btn.style.top = (8 + Math.random() * 55) + '%';
    goldenHideAt = Date.now() + 9000;
  }

  function catchGolden() {
    $('golden').hidden = true;
    nextGolden = Date.now() + 45000 + Math.random() * 50000;
    state.frenzyUntil = Date.now() + E.FRENZY_MS;
    state.goldens += 1;
    E.noteDaily(state, 'golden', 1, Date.now());
    noteUnlocks(E.syncAchievements(state, { hour: new Date().getHours() }));
    toast('Golden schooner · 7× for 30s');
    save();
    renderHud();
  }

  function doPour(clientX) {
    account();
    var now = Date.now();
    if (now - lastTapAt <= 850) combo += 1;
    else combo = 1;
    lastTapAt = now;
    if (combo > (state.bestCombo || 0)) state.bestCombo = combo;
    if (E.inHappyHour(new Date(now))) state.tappedHappy = true;
    var gain = E.tap(state, combo);
    E.noteDaily(state, 'tapEarn', gain, now);
    E.noteDaily(state, 'taps', 1, now);
    E.noteDaily(state, 'earn', gain, now);
    E.noteDaily(state, 'combo', combo, now);
    svg.classList.remove('is-pouring');
    void svg.offsetWidth;
    svg.classList.add('is-pouring');
    spawnFloater(gain);
    popCount();
    if (navigator.vibrate) navigator.vibrate(12);
    blip();
    noteUnlocks(E.syncAchievements(state, { hour: new Date(now).getHours() }));
    saveSoon();
    renderHud();
    maybeRenderShop();
  }

  function shake(btn) {
    if (!btn) return;
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');
  }

  function openSheet() {
    sheet.hidden = false;
    renderShop(true);
    $('closeShop').focus();
  }

  function closeSheet() {
    sheet.hidden = true;
    shopBtn.focus();
  }

  function openModal(mode, title, body) {
    modalMode = mode;
    modalTitle.textContent = title;
    modalBody.textContent = body;
    var danger = mode === 'reset' || mode === 'prestige';
    modalCancel.hidden = !danger;
    modalOk.textContent = mode === 'reset' ? 'Reset' : mode === 'prestige' ? 'Last Call' : 'Cheers';
    modalOk.className = danger ? 'danger' : 'primary';
    modal.hidden = false;
    (danger ? modalCancel : modalOk).focus();
  }

  function dismissModal(confirm) {
    var mode = modalMode;
    modal.hidden = true;
    modalMode = null;
    if (mode === 'reset' && confirm) doReset();
    else if (mode === 'prestige' && confirm) doPrestige();
    else if (!sheet.hidden) $('closeShop').focus();
  }

  function maybeShowAway() {
    if (!pendingAway || !modal.hidden) return;
    var info = pendingAway;
    pendingAway = null;
    var body = 'The taps kept pouring. +' + fmtExact(info.gain) + ' schooners while you were away.';
    if (info.capped) body += ' The kegs stop counting after 8 hours.';
    openModal('away', 'Welcome back', body);
  }

  function doReset() {
    pendingAway = null;
    var sound = state.sound;
    state = E.freshState(Date.now());
    state.sound = sound;
    combo = 0;
    lastSig = '';
    save();
    closeSheet();
    applyLook();
    updateSound();
    renderHud();
  }

  function doPrestige() {
    var result = E.prestige(state);
    if (!result.ok) return;
    combo = 0;
    lastSig = '';
    toast('Last Call · +' + result.gain + ' tokens');
    noteUnlocks(E.syncAchievements(state, {}));
    save();
    renderHud();
    renderShop(true);
  }

  function shareCard() {
    var canvas = document.createElement('canvas');
    canvas.width = 720;
    canvas.height = 960;
    var g = canvas.getContext('2d');
    g.fillStyle = '#1A0F24';
    g.fillRect(0, 0, 720, 960);
    g.fillStyle = '#F5A623';
    g.fillRect(0, 0, 720, 16);
    g.font = '800 54px -apple-system, sans-serif';
    g.fillStyle = '#FFF8E7';
    g.fillText('Tap Drink 2', 48, 140);
    g.font = '800 92px -apple-system, sans-serif';
    g.fillText(fmt(state.schooners), 48, 280);
    g.font = '700 28px -apple-system, sans-serif';
    g.fillStyle = '#F5A623';
    g.fillText('SCHOONERS', 48, 324);
    g.fillStyle = '#FFF8E7';
    g.font = '600 32px -apple-system, sans-serif';
    var lines = [
      fmtSps(E.passivePerSecond(state)) + ' per second',
      fmt(state.total) + ' poured lifetime',
      fmt(state.taps) + ' taps',
      (state.tokens || 0) + ' hangover tokens',
      'Venue · ' + ((E.VENUES.filter(function (v) { return v.id === state.venue; })[0] || {}).name || 'The Local')
    ];
    lines.forEach(function (line, i) { g.fillText(line, 48, 430 + i * 56); });
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var file = new File([blob], 'tap-drink-2.png', { type: 'image/png' });
      var share = { files: [file], title: 'Tap Drink 2', text: fmt(state.schooners) + ' schooners' };
      if (navigator.canShare && navigator.canShare(share)) {
        navigator.share(share).catch(function () {});
      } else {
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'tap-drink-2.png';
        link.click();
      }
    });
  }

  function onBuy(btn) {
    account();
    var id = btn.getAttribute('data-buy');
    var kind = btn.getAttribute('data-kind');
    var now = Date.now();
    if (kind === 'badge') return;
    if (kind === 'share') { shareCard(); return; }
    if (kind === 'prestige') {
      var gain = E.tokensFromRun(state.run);
      if (gain < 1) { shake(btn); return; }
      openModal('prestige', 'Last Call?', 'This run resets. You keep ' + gain + ' new Hangover Tokens, your badges, venues, and skins. Tokens permanently boost income.');
      return;
    }
    if (kind === 'daily') {
      var ch = E.ensureDaily(state);
      if (state.daily.claimed) return;
      if (state.daily.done) {
        var claimed = E.claimDaily(state, now);
        if (claimed.ok) toast('Daily reward · +' + fmt(claimed.reward));
      } else if (ch.limit && !state.daily.started) {
        E.startDaily(state, now);
      } else return;
      noteUnlocks(E.syncAchievements(state, { hour: new Date(now).getHours() }));
      save();
      renderHud();
      renderShop(true);
      return;
    }
    var result = kind === 'up' ? E.tryBuyUpgrade(state, id)
      : kind === 'level' ? E.tryBuyLevel(state, id)
      : kind === 'venue' ? E.tryBuyVenue(state, id)
      : kind === 'skin' ? E.tryBuySkin(state, id)
      : E.tryBuyProducer(state, id, buyMode);
    if (!result.ok) { shake(btn); return; }
    if (kind === 'prod') E.noteDaily(state, 'buys', result.qty || 1, now);
    if (kind === 'venue' || kind === 'skin') applyLook();
    popCount();
    blip();
    noteUnlocks(E.syncAchievements(state, { hour: new Date(now).getHours() }));
    save();
    renderHud();
    renderShop(true);
  }

  pourBtn.addEventListener('pointerdown', function (e) {
    if (e.button && e.button !== 0) return;
    e.preventDefault();
    doPour(e.clientX);
  }, { passive: false });
  pourBtn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      doPour();
    }
  });

  shopBtn.addEventListener('click', openSheet);
  $('closeShop').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
  shopList.addEventListener('pointerdown', function () { holding = true; });
  window.addEventListener('pointerup', function () { holding = false; });
  window.addEventListener('pointercancel', function () { holding = false; });
  shopList.addEventListener('click', function (e) {
    var btn = e.target.closest('.item');
    if (!btn || btn.disabled) return;
    onBuy(btn);
  });
  document.querySelectorAll('[data-tab]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      shopTab = btn.getAttribute('data-tab');
      document.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('on', b === btn); });
      renderShop(true);
    });
  });
  $('golden').addEventListener('click', function (e) {
    e.stopPropagation();
    catchGolden();
  });
  document.querySelectorAll('[data-qty]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      buyMode = Number(btn.getAttribute('data-qty')) === 10 ? 10 : 1;
      document.querySelectorAll('[data-qty]').forEach(function (b) {
        b.classList.toggle('on', b === btn);
      });
      renderShop(true);
    });
  });
  $('resetBtn').addEventListener('click', function () {
    openModal('reset', 'Start over?', 'This empties your schooners, sends the staff home, and clears every upgrade on this phone.');
  });
  modalCancel.addEventListener('click', function () { dismissModal(false); });
  modalOk.addEventListener('click', function () { dismissModal(modalMode === 'reset'); });
  modal.addEventListener('click', function (e) {
    if (e.target === modal && modalMode !== 'reset') dismissModal(false);
  });
  soundBtn.addEventListener('click', function () {
    state.sound = !state.sound;
    updateSound();
    save();
    blip();
  });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!modal.hidden) { dismissModal(false); return; }
      if (!sheet.hidden) closeSheet();
      return;
    }
    if ((e.key === ' ' || e.key === 'Enter') && e.target === document.body && sheet.hidden && modal.hidden) {
      e.preventDefault();
      doPour();
    }
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('animate').forEach(function (node) { node.remove(); });
  }

  state = E.sanitize(readRaw(), Date.now());
  E.ensureDaily(state);
  applyLook();
  noteUnlocks(E.syncAchievements(state, {}));
  account();
  updateSound();
  renderHud();
  save();

  function frame() {
    var now = Date.now();
    var away = account();
    if (away.gain > 0) E.noteDaily(state, 'earn', away.gain, now);
    if (combo > 0 && now - lastTapAt > 800 && now - comboDecayAt > 160) {
      combo = Math.max(0, combo - 1);
      comboDecayAt = now;
    }
    var golden = $('golden');
    if (golden.hidden && now >= nextGolden && (state.frenzyUntil || 0) < now) showGolden();
    if (!golden.hidden && goldenHideAt && now > goldenHideAt) {
      golden.hidden = true;
      nextGolden = now + 35000 + Math.random() * 40000;
    }
    renderHud();
    maybeRenderShop();
    maybeShowAway();
    if (now - lastSave > 2000) save();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('pagehide', function () { account(); save(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { account(); save(); }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
